name: CI

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,env
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,env

      - name: Check formatting with black
        run: |
          black --check --diff flytsonar/ || true

  lint-javascript:
    name: JavaScript Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install ESLint
        run: |
          npm install -g eslint

      - name: Lint JavaScript files
        run: |
          eslint flytsonar/static/js/index.js || true
        continue-on-error: true

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  arduino-compile:
    name: Arduino Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Arduino libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          # Note: rosserial and NewPing libraries need to be installed
          # arduino-cli lib install "NewPing"
          # arduino-cli lib install "Rosserial Arduino Library"
        continue-on-error: true

      - name: Compile Arduino sketch
        run: |
          # arduino-cli compile --fqbn arduino:avr:uno arduino/sonar_jig_6.ino
          echo "Arduino compilation check skipped - requires rosserial library setup"
        continue-on-error: true

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-flask pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          # pytest tests/ --cov=flytsonar --cov-report=xml --cov-report=term
          echo "No tests defined yet - add pytest tests in future phase"
        continue-on-error: true

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety
          if [ -f requirements.txt ]; then safety check -r requirements.txt || true; fi
        continue-on-error: true

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint-python, lint-javascript, security-check]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "Build completed!"
          echo "Python lint: ${{ needs.lint-python.result }}"
          echo "JavaScript lint: ${{ needs.lint-javascript.result }}"
          echo "Security check: ${{ needs.security-check.result }}"
