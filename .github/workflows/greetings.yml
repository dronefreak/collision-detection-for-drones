# Greet first-time contributors
# Welcomes new contributors with helpful information

name: 'Greetings'

on:
  issues:
    types: [opened]
  pull_requests:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          issue-message: |
            👋 Welcome to the Collision Detection for Drones project!

            Thank you for opening your first issue! We appreciate your contribution to the project.

            **What happens next?**
            - A maintainer will review your issue and respond as soon as possible
            - Please provide any additional information if requested
            - Feel free to ask questions if anything is unclear

            **Helpful resources:**
            - [Contributing Guide](../CONTRIBUTING.md) - Learn how to contribute
            - [Code of Conduct](../CODE_OF_CONDUCT.md) - Our community standards
            - [Security Policy](../SECURITY.md) - How to report security issues

            We're excited to have you here! 🚁

          pr-message: |
            🎉 Congratulations on your first pull request!

            Thank you for contributing to the Collision Detection for Drones project!

            **What happens next?**
            - Automated checks will run (linting, tests, security scans)
            - A maintainer will review your code and provide feedback
            - Please address any review comments or failing checks
            - Once approved, your PR will be merged

            **Tips for a successful PR:**
            - ✅ Make sure all CI checks pass (see the status above)
            - ✅ Keep your commits focused and well-described
            - ✅ Follow the project's coding standards
            - ✅ Update documentation if needed
            - ✅ Add tests for new features

            **Helpful resources:**
            - [Contributing Guide](../CONTRIBUTING.md) - Development workflow
            - [Code Style](../CONTRIBUTING.md#code-style) - Coding standards

            Thank you for making this project better! 🚀
